name: vessel positions

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ships
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Previous data
        run: git fetch --depth=1 origin ship-data && git show origin/ship-data:ships.json > ships.json || echo '{}' > ships.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets searoute
      - name: Collect
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
        run: python scripts/ships.py vessels.json ships.json
      - name: Publish to ship-data branch
        run: |
          mkdir out && cp ships.json out/ && cd out
          git init -q -b ship-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ships.json && git commit -qm "ships.json"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ship-data
